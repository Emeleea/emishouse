  location: "50 Sousa Mendes St, Toronto, ON M6P 3Z5"
  description: "2SLGBTQ+ Drop-In Tuesdays and Trans/Gender Diverse Drop-In Wednesdays at the GCNC: A safe, twice weekly space for youth 12-18 to be themselves, wherever they are in their journey. Facilitating connection, support, and community; we aim to build youth resilience and self-expression through skill-building, sharing resources, peer engagement, and affirming workshops that empower individuals to thrive. Your contribution helps us sustain programming that supports at-risk youth of all genders and sexual identities at a critical stage of their personal and social development."

