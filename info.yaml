  url: "https://www.yohomo.ca/"
  location: "50 Sousa Mendes St, Toronto, ON M6P 3Z5"
  description: "Southpaw is a 5-week workshop program for trans, gender diverse and questioning youth (ages 18-29). It is a safe and accessible space for those who are starting out on their journey to connect with each other, build community and learn new skills. Light meals, transportation reimbursement and a small honorarium will be provided. The workshops will focus on community building, movement, wellness, fashion, navigating ID-clinics and employment. Fridays from 6:30-8PM, March 13 to April 10."

